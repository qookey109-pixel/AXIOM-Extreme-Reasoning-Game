name: Build PNG puzzle assets
on:
  push:
    branches: [main]
    paths:
      - 'assets/*.svg'
      - 'scripts/render_png.py'
      - '.github/workflows/render-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render static PNG assets
        run: |
          python -m pip install 'CairoSVG==2.7.1'
          python scripts/render_png.py
      - name: Commit prerendered images
        run: |
          if [ -n "$(git status --porcelain assets/png)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/png
            git commit -m "build: prerender AXIOM puzzle images [skip ci]"
            git push origin HEAD:main
          fi
