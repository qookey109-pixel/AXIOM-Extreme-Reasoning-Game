name: AXIOM V0.5 verification and responsive QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/check-*.mjs'
      - 'scripts/sync-question-bank.mjs'
      - 'question_bank.json'
      - 'package.json'
      - '.github/workflows/axiom-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'scripts/check-*.mjs'
      - 'package.json'
      - '.github/workflows/axiom-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate puzzle bank
        run: |
          node --check src/questions.js
          node --check src/verification.js
          node --check src/graphics.js
          node --check src/app.js
          npm test
      - name: Install browser testing tool
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Chromium responsive smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/axiom-server.log 2>&1 &
          sleep 2
          node scripts/check-ui.mjs
      - name: Sweep all 62 visual questions and capture screenshots
        run: node scripts/check-visual.mjs
      - name: Upload visual audit captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiom-62-puzzle-visual-audit
          path: visual-qa/
          if-no-files-found: warn
